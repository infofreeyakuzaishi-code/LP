<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>薬剤師ろぎー公式 | 予防医学の冒険家</title>
    <style>
        :root {
            --primary-orange: #FF8C00;
            --accent-yellow: #FFD700;
            --line-green: #06C755;
            --text-dark: #333;
            --text-light: #666;
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'BIZ UDPGothic', sans-serif;
            line-height: 1.6;
            margin: 0;
            color: var(--text-dark);
            background: linear-gradient(180deg, #fffaf0 0%, #ffffff 100%);
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, var(--primary-orange), var(--accent-yellow));
            color: white;
            padding: 60px 20px 120px;
            text-align: center;
        }
        header p { margin: 0; font-weight: bold; letter-spacing: 0.1em; opacity: 0.9; }
        
        .container {
            max-width: 500px; /* 少しスリムに */
            margin: -90px auto 40px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px 20px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            position: relative;
            text-align: center;
        }
        .profile-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 6px solid white;
            margin-top: -120px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        h1 { margin: 20px 0 5px; font-size: 1.6rem; letter-spacing: 0.05em; }
        .tagline { color: var(--primary-orange); font-weight: bold; margin-bottom: 25px; font-size: 0.95rem; }
        .intro-text { font-size: 0.9rem; text-align: left; background: #fff9f0; padding: 20px; border-radius: 20px; margin-bottom: 30px; color: #555; border: 1px solid #ffeeda; }
        
        /* スタイリッシュなカードリンク */
        .menu-selection { display: flex; flex-direction: column; gap: 15px; }
        .menu-card {
            display: block;
            text-decoration: none;
            background: white;
            border: 1px solid #eee;
            border-radius: 20px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-align: left;
        }
        .menu-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-yellow);
            box-shadow: 0 10px 20px rgba(255, 140, 0, 0.1);
        }
        .menu-card::after {
            content: "LINEで詳細を見る →";
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 0.75rem;
            color: var(--line-green);
            font-weight: bold;
            opacity: 0;
            transition: 0.3s;
        }
        .menu-card:hover::after { opacity: 1; }
        
        .menu-card h3 { margin: 0 0 8px 0; font-size: 1.05rem; color: var(--text-dark); display: flex; align-items: center; gap: 8px; }
        .menu-card p { margin: 0; font-size: 0.85rem; color: var(--text-light); padding-right: 20px; }

        footer { font-size: 0.75rem; color: #bbb; margin-top: 50px; padding-bottom: 30px; letter-spacing: 0.05em; }
    </style>
</head>
<body>

<header>
    <p>お坊さんとくーさんのラジオを聴いた皆さまへ</p>
</header>

<div class="container">
    <img src="images/profile-img.png" alt="薬剤師ろぎー" class="profile-img">
    
    <h1>薬剤師ろぎー</h1>
    <p class="tagline">薬を出すより、ワクワクを出したい。<br>予防医学の冒険家</p>

    <div class="intro-text">
        ラジオをお聴きいただきありがとうございます！<br>
        100年続く人生の旅を「最高に楽しい！」で満たすための、心と体のメンテナンスをご提案しています。
    </div>

    <div class="menu-selection">
        <!-- カード全体がリンクになっています -->
        <a href="https://line.me/R/oaMessage/@534uoyka/?【サプリ提案の詳細希望】" class="menu-card">
            <h3>💊 オーダーメイドサプリ</h3>
            <p>18年の知見から、今のあなたに最適な栄養を導き出します。</p>
        </a>

        <a href="https://line.me/R/oaMessage/@534uoyka/?【オンライン薬局について知りたい】" class="menu-card">
            <h3>✨ オンライン薬局</h3>
            <p>もう薬局で待たなくていい。処方箋を写真で送るだけで自宅に薬が届く新しい仕組み。</p>
        </a>

        <a href="https://line.me/R/oaMessage/@534uoyka/?【ライブ配信の相談希望】" class="menu-card">
            <h3>🚀 ライブ配信</h3>
            <p>「繋がる力」と「自己PR」を伝授し年30－100万円の収入増を叶えます。</p>
        </a>
    </div>

    <footer>
        &copy; 2026 予防医学薬剤師ろぎー
    </footer>
</div>

</body>
</html>
