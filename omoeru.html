
<!DOCTYPE html><html lang='ja'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>想える人。</title><link rel='preconnect' href='https://fonts.googleapis.com'><link rel='preconnect' href='https://fonts.gstatic.com' crossorigin><link href='https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap' rel='stylesheet'><link rel='stylesheet' href='style.css'></head><body><section class='hero'><div class='overlay'></div><div class='hero-inner'><p class='eyebrow'>A quiet beginning</p><h1>想える人。</h1><p class='lead'>自分のことも、誰かのことも、地域のことも。少しだけ想える人へ。</p><a class='btn' href='#step1'>3分だけ、あなたの考え方を教えてください</a></div></section><section id='step1' class='section'><div class='container'><div class='progress'><div class='bar' style='width:10%'></div></div><p class='step'>STEP 1 / 10</p><h2>何か新しい情報や面白いものを見つけたとき、あなたはどうすることが多いですか？</h2><div class='grid'><button class='card'>まず自分で試してみる</button><button class='card'>周りの人に相談する</button><button class='card'>とりあえず保存して他の情報も見る</button><button class='card'>特に何もしないことが多い</button></div></div></section><section class='section alt'><div class='container narrow'><p class='eyebrow'>Across Japan</p><h2>北海道にも、沖縄にも、宮古島にも。</h2><p>想える人は、少しずつ増えています。</p><div class='map'>47都道府県マップ（完成版でアニメーション実装）</div></div></section><section class='section'><div class='container narrow'><p class='eyebrow'>30 minutes</p><h2>ここまで読んで、「少しだけ話を聞いてみたい」と思ったら。</h2><p>営業ではありません。価値観が合うかどうかを確認する時間です。</p><a class='btn' href='https://script.google.com/macros/s/AKfycbzkrEJ7dVbWkEYvxW7lE8Pu8REcsWelbscCZtQAwpIYTKQtzs0VeIYw9QnHJFbBPxfWHA/exec'>個別相談を予約する</a></div></section><script src='script.js'></script></body></html>
